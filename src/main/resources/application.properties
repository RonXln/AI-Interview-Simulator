spring.application.name=demo
server.port=8081
server.address=0.0.0.0

# 日志/请求全链路 UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============================================
# 以下变量从 .env 或环境变量注入
# .env 加载由 me.paulschwarz:spring-dotenv 自动完成
# ============================================

# --- DeepSeek LLM ---
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

# --- 本地 TTS ---
tts.python.cmd=${TTS_PYTHON_CMD:python}
tts.script.path=${TTS_SCRIPT_PATH:tts.py}

# --- 阿里云百炼 DashScope（Paraformer-Realtime-v2 ASR） ---
dashscope.api.key=${DASHSCOPE_API_KEY:}
dashscope.ws.url=${DASHSCOPE_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
asr.model=${ASR_MODEL:paraformer-realtime-v2}
# VAD 断句静音阈值 (ms)，200~6000；越小反应越快但更容易在停顿中被切断
asr.max-sentence-silence=${ASR_MAX_SENTENCE_SILENCE:600}
# 单语识别：en/zh；也可 "en,zh" 双语。英文面试场景推荐 en，速度和准确率明显更好
asr.language=${ASR_LANGUAGE:en}

# --- Speculative LLM（第 5 步）---
# 用户 partial 稳定后提前跑 LLM+TTS；VAD endpoint 命中时直接播缓存。
speculative.enabled=${SPECULATIVE_ENABLED:true}
speculative.min-partial-len=${SPECULATIVE_MIN_PARTIAL_LEN:8}
speculative.debounce-ms=${SPECULATIVE_DEBOUNCE_MS:400}
# final 与 partial 长度差 ≤ 该值时视为命中（宽松前缀比较）
speculative.commit-len-tolerance=${SPECULATIVE_COMMIT_LEN_TOLERANCE:25}

# --- Interrupt Detector（第 7 步：LLM 判定 + Gate 前置）---
# Gate 通过后异步 call mini LLM 判定"该不该打断 + 谁 + 说什么"。单面群面统一走。
interrupt.enabled=${INTERRUPT_ENABLED:true}
# partial 至少多少个词才考虑判定（防止刚开口就 call LLM）
interrupt.min-words-for-check=${INTERRUPT_MIN_WORDS_FOR_CHECK:8}
# 本轮 turn 至少说了多久才考虑判定（ms）
interrupt.turn-min-ms-for-check=${INTERRUPT_TURN_MIN_MS_FOR_CHECK:8000}
# 两次 LLM 判定之间的冷却（ms），避免每 partial 都 call
interrupt.check-cooldown-ms=${INTERRUPT_CHECK_COOLDOWN_MS:6000}
# 真打断成功后的静默期（ms），防止连续打断
interrupt.interrupt-cooldown-ms=${INTERRUPT_INTERRUPT_COOLDOWN_MS:15000}
# 每 session 最多打断几次
interrupt.budget-per-session=${INTERRUPT_BUDGET_PER_SESSION:3}

# --- 沉默检测（第 8 步）---
# 用户轮到自己却不说话时，AI 会像真人面试官一样按档位处理。
silence.enabled=${SILENCE_ENABLED:true}
# 单面：L1 关心 -> L2 换问题 -> L3 允许结束（累计 ~15s 到 L3）
silence.single.level1-ms=${SILENCE_SINGLE_L1_MS:4000}
silence.single.level2-ms=${SILENCE_SINGLE_L2_MS:5000}
silence.single.level3-ms=${SILENCE_SINGLE_L3_MS:6000}
# 群面：AI 候选人自我推进，节奏接近真实群面换气
silence.group.ms=${SILENCE_GROUP_MS:2000}

# --- 抢占（Preempt）：AI 装填期（PLANNING）用户开口即取消 AI 输出 ---
# 用户 partial 在 AI 装填期出现即抢占；这里配置最短判定门槛
preempt.enabled=${PREEMPT_ENABLED:true}
# partial 最少字符数（低于视为杂音）
preempt.min-chars=${PREEMPT_MIN_CHARS:3}
# 字母占比阈值（0-1），低于视为非英文杂音
preempt.min-letter-ratio=${PREEMPT_MIN_LETTER_RATIO:0.5}